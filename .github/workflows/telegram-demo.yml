name: GymBody v67 - Telegram real demo (private chat)
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gymbody-demo-telegram
  cancel-in-progress: false
jobs:
  telegram-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Responder a pedidos fictícios autorizados
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
        run: python3 scripts/telegram-demo-reply.py
      - name: Persistir autorizacoes sem guardar IDs Telegram
        run: |
          if [ -f demo-telegram-authorized.json ] || [ -f demo-telegram-queue.enc ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add demo-telegram-authorized.json demo-telegram-queue.enc 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "chore: persist hashed Telegram demo authorization [skip ci]"
              git push
            fi
          fi
